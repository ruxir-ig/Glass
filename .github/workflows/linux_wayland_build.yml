name: linux_wayland_build

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build_linux_wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Setup cargo config
        run: |
          mkdir -p ./../.cargo
          cp ./.cargo/ci-config.toml ./../.cargo/config.toml

      - name: Install Linux dependencies
        run: ./script/linux

      - name: Build Glass on Linux
        run: cargo check -p zed

      - name: Verify Linux launch path (Wayland env)
        run: XDG_SESSION_TYPE=wayland cargo run -p zed -- --system-specs >/tmp/glass-system-specs.txt

      - name: Validate launch output
        run: |
          test -s /tmp/glass-system-specs.txt
          grep -q "System Specs" /tmp/glass-system-specs.txt
